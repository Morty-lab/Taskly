# Overrides the build settings in the Netlify UI (left over from Taskly: publish "build/client").
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Vite 8 and TypeScript 7 need Node 22.
  NODE_VERSION = "22"
  # Public Appwrite identifiers, baked into the page bundle. The API key is NOT set here:
  # add APPWRITE_API_KEY in Site configuration → Environment variables (Functions scope).
  VITE_APPWRITE_ENDPOINT = "https://sgp.cloud.appwrite.io/v1"
  VITE_APPWRITE_PROJECT_ID = "6b07b401003ce48ec508"

[functions]
  node_bundler = "esbuild"

# The API runs as one function (netlify/functions/api.ts).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single-page app: every other path loads index.html and the client router takes over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
